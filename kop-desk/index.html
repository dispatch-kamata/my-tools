<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="description" content="リヴァプールFC 2026/27 — 試合・スカッド・フォーメーション・移籍を1画面で追うパーソナルダッシュボード">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="KOP DESK">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>KOP DESK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://resources.premierleague.com" crossorigin>
<link rel="preconnect" href="https://www.fotmob.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800;900&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --red:#C8102E;
  --red-lo:#8C0B20;
  --red-tint:#FDF2F4;
  --bg:#F4F1F2;
  --panel:#FFFFFF;
  --panel-2:#FAF7F8;
  --line:#E4DCDF;
  --line-lo:#EFE9EB;
  --ink:#160D10;
  --mist:#63535A;
  --mist-lo:#8F7F86;
  --gold:#8A6A00;
  --pitch:#0B8A4B;
  --pitch-bg:#EDF7F1;
  --pitch-line:#C3E0CE;
  --pad:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Archivo','Noto Sans JP',system-ui,sans-serif;
  font-size:15px;line-height:1.55;
  padding-bottom:env(safe-area-inset-bottom);
  overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}

/* ── エンブレム ─────────────────────────── */
.crest{position:relative;display:inline-block;width:var(--sz,28px);height:var(--sz,28px);flex:0 0 auto;vertical-align:middle}
.crest i{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-style:normal;font-weight:800;font-size:calc(var(--sz,28px)*.32);letter-spacing:.01em;
  color:#fff;background:var(--cc,#666);border-radius:5px;line-height:1;
}
.crest img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;background:#fff;border-radius:5px}

/* ── header ─────────────────────────────── */
header{
  position:sticky;top:0;z-index:50;
  background:rgba(255,255,255,.93);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
.brand{display:flex;align-items:center;gap:10px;padding:11px var(--pad) 9px}
.brand h1{font-size:19px;font-weight:900;letter-spacing:.13em}
.brand h1 em{font-style:normal;color:var(--red)}
.pill{
  margin-left:auto;display:inline-flex;align-items:center;gap:6px;
  border:1px solid var(--line);background:var(--panel);border-radius:100px;
  font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.06em;
  color:var(--mist);padding:4px 10px;cursor:pointer;
}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--mist-lo)}
.pill.live{color:var(--pitch);border-color:#BFE6D0}
.pill.live::before{background:var(--pitch)}
.pill.busy::before{animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
nav{display:flex;padding:0 calc(var(--pad) - 8px);overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{
  flex:1 0 auto;background:none;border:0;color:var(--mist-lo);
  font-family:inherit;font-size:12.5px;font-weight:700;letter-spacing:.04em;
  padding:9px 11px 11px;cursor:pointer;white-space:nowrap;
  border-bottom:2px solid transparent;transition:color .18s,border-color .18s;
}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--red)}
nav button:focus-visible{outline:2px solid var(--red);outline-offset:-2px;border-radius:3px}

main{padding:var(--pad) var(--pad) 70px;max-width:660px;margin:0 auto}
.panel-view[hidden]{display:none}

.eyebrow{
  display:flex;align-items:center;gap:9px;
  font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;
  color:var(--mist-lo);margin:32px 0 12px;
}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--line)}
.eyebrow:first-child{margin-top:0}
.eyebrow b{color:var(--mist);font-weight:700;letter-spacing:.1em}

/* ── next match ─────────────────────────── */
.next{
  border:1px solid var(--line);border-top:3px solid var(--red);border-radius:2px;
  background:linear-gradient(168deg,var(--red-tint),var(--panel) 58%);
  padding:18px 18px 16px;
}
.next .tag{font-size:9.5px;letter-spacing:.22em;color:var(--red);font-weight:800}
.next .vs{display:flex;align-items:center;gap:11px;margin:11px 0 15px}
.next .vs .x{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--red);font-weight:600}
.next .vs .nm{font-size:22px;font-weight:900;letter-spacing:-.01em;line-height:1.1;min-width:0}
.next .vs .nm small{display:block;font-size:11px;font-weight:500;color:var(--mist-lo);letter-spacing:.05em;margin-top:2px}
.clock{display:flex;gap:5px;align-items:flex-end}
.unit{text-align:center}
.unit b{display:block;font-family:'IBM Plex Mono',monospace;font-size:33px;font-weight:600;line-height:1;letter-spacing:-.03em}
.unit span{font-size:9px;letter-spacing:.16em;color:var(--mist-lo)}
.colon{font-family:'IBM Plex Mono',monospace;font-size:27px;color:var(--red);padding-bottom:14px}
.next .meta{margin-top:15px;padding-top:13px;border-top:1px solid var(--line);font-size:12.5px;color:var(--mist);display:flex;flex-wrap:wrap;gap:4px 14px}
.next .meta b{color:var(--ink);font-weight:700}
.next .note{margin-top:8px;font-size:12px;color:var(--mist-lo)}

/* ── result ─────────────────────────────── */
.result{border:1px solid var(--line);background:var(--panel);margin-bottom:16px;border-radius:2px;overflow:hidden}
.result .head{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:11px 16px;border-bottom:1px solid var(--line);background:var(--panel-2);
  font-size:10px;letter-spacing:.14em;color:var(--mist-lo);text-transform:uppercase;
}
.ft{color:var(--red);font-weight:800;flex:0 0 auto}
.scoreline{padding:14px 16px 6px}
.row{display:flex;align-items:center;gap:11px;padding:6px 0}
.row .club{flex:1;font-size:18px;font-weight:800}
.row.us .club{color:var(--red)}
.row .num{font-family:'IBM Plex Mono',monospace;font-size:29px;font-weight:600;line-height:1;min-width:32px;text-align:right}
.row.lose .club,.row.lose .num{color:var(--mist-lo)}
.row.lose .crest{opacity:.55}

.timeline{position:relative;padding:14px 16px 18px;margin-top:4px;border-top:1px solid var(--line)}
.timeline::before{content:"";position:absolute;left:50%;top:0;bottom:18px;width:1px;background:linear-gradient(180deg,var(--line),#E9B9C2,var(--line))}
.ev{display:grid;grid-template-columns:1fr 46px 1fr;align-items:center;padding:7px 0;position:relative}
.ev .min{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;text-align:center;color:var(--mist-lo);background:var(--panel);padding:2px 0;z-index:1;grid-column:2}
.ev .who{font-size:13.5px;font-weight:600;line-height:1.3;position:relative}
.ev .agg{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--mist-lo);display:block}
.ev.home .who{grid-column:1;text-align:right;padding-right:12px}
.ev.away .who{grid-column:3;text-align:left;padding-left:12px;color:var(--mist)}
.ev.home .who::after,.ev.away .who::before{content:"";position:absolute;top:50%;width:7px;height:7px;border-radius:50%;transform:translateY(-50%)}
.ev.home .who::after{right:-3.5px;background:var(--red);box-shadow:0 0 0 3px var(--panel)}
.ev.away .who::before{left:-3.5px;background:var(--panel);border:1.5px solid var(--mist-lo);box-shadow:0 0 0 3px var(--panel)}

/* ── expandable block ───────────────────── */
details.blk{border-top:1px solid var(--line)}
details.blk>summary{
  list-style:none;cursor:pointer;padding:12px 16px;
  font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--mist);
  display:flex;align-items:center;gap:8px;
}
details.blk>summary::-webkit-details-marker{display:none}
details.blk>summary::after{content:"＋";margin-left:auto;font-size:13px;color:var(--mist-lo)}
details.blk[open]>summary::after{content:"−"}
details.blk>summary:hover{background:var(--panel-2)}
.blkbody{padding:2px 16px 16px}

/* ── stat bars ──────────────────────────── */
.sgrp{margin-bottom:16px}
.sgrp>h4{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--mist-lo);margin:0 0 9px;padding-bottom:6px;border-bottom:1px solid var(--line-lo)}
.stat{margin:12px 0}
.stat .lb{display:flex;align-items:baseline;gap:8px;font-size:11.5px;color:var(--mist);margin-bottom:5px}
.stat .lb span{flex:1;text-align:center;letter-spacing:.04em}
.stat .lb b{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:12.5px;color:var(--ink);min-width:62px}
.stat .lb b:last-child{text-align:right}
.stat .lb b.win{color:var(--red)}
.stat .bar{display:flex;height:6px;background:var(--line-lo);border-radius:3px;overflow:hidden;gap:1px}
.stat .bar i{display:block;height:100%}
.stat .bar i.a{background:var(--red);border-radius:3px 0 0 3px}
.stat .bar i.b{background:#C6B9BE;border-radius:0 3px 3px 0}

/* ── pitch ──────────────────────────────── */
.pitchwrap{border:1px solid var(--line);background:var(--panel);padding:14px;border-radius:2px}
.pitchhead{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.pitchhead b{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:600;letter-spacing:.04em}
.pitchhead span{font-size:9.5px;letter-spacing:.16em;color:var(--red);border:1px solid currentColor;padding:2px 6px;font-weight:800}
.pitch{position:relative;width:100%;aspect-ratio:72/100;background:var(--pitch-bg);border:1px solid var(--line);border-radius:2px;overflow:hidden}
.pitch .lines{position:absolute;inset:0;width:100%;height:100%}
.pl{position:absolute;transform:translate(-50%,50%);text-align:center;width:70px}
.pl .sh{
  position:relative;width:38px;height:38px;margin:0 auto 4px;border-radius:50%;
  background:linear-gradient(160deg,var(--red),var(--red-lo));
  border:1.5px solid #fff;
  display:flex;align-items:center;justify-content:center;
  font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600;color:#fff;
  box-shadow:0 2px 7px rgba(140,11,32,.3);
}
.pl.gk .sh{background:linear-gradient(160deg,#17864A,#0C5A31);box-shadow:0 2px 7px rgba(12,90,49,.3)}
.pl .rt{
  position:absolute;right:-8px;bottom:-5px;min-width:24px;padding:1px 3px;border-radius:3px;
  font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;color:#fff;border:1.5px solid #fff;
}
.pl .nm{display:block;font-size:10.5px;font-weight:700;line-height:1.2;letter-spacing:-.01em}
.pl .rl{display:block;font-size:8.5px;color:var(--mist-lo);letter-spacing:.1em;font-family:'IBM Plex Mono',monospace;line-height:1.5}
.pl button{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;width:100%}
.pl button:focus-visible{outline:2px solid var(--red);outline-offset:3px;border-radius:6px}
.pl .off{position:absolute;left:-6px;bottom:-4px;font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--mist-lo);background:var(--pitch-bg);padding:0 2px;border-radius:2px}
.formnote{font-size:12.5px;color:var(--mist);line-height:1.75;margin-top:13px;padding-top:12px;border-top:1px solid var(--line)}
.bench{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.bench button{background:var(--panel-2);border:1px solid var(--line);border-radius:3px;color:var(--mist);font-family:inherit;font-size:11.5px;padding:5px 9px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.bench button b{color:var(--ink);font-family:'IBM Plex Mono',monospace;font-weight:600}
.bench button:hover{border-color:var(--red)}
.rt-pill{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;color:#fff;padding:1px 4px;border-radius:3px}

/* ── squad list ─────────────────────────── */
.plist{border-top:1px solid var(--line)}
.prow{
  display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:center;
  width:100%;padding:12px 4px;border:0;border-bottom:1px solid var(--line);
  background:none;color:inherit;font:inherit;cursor:pointer;text-align:left;
}
.prow:hover{background:var(--panel)}
.prow .no{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--mist-lo);text-align:center}
.prow .nm{font-size:14.5px;font-weight:700;line-height:1.25}
.prow .nm .ja{display:block;font-size:11px;color:var(--mist-lo);font-weight:400}
.prow .rt{text-align:right;font-size:11px;color:var(--mist-lo);font-family:'IBM Plex Mono',monospace;line-height:1.4}
.prow .rt .fl{font-size:14px;font-family:inherit}
.badge-c,.badge-n,.badge-i{font-size:8.5px;font-weight:800;letter-spacing:.08em;padding:1px 5px;margin-left:6px;vertical-align:2px;border-radius:2px}
.badge-c{color:var(--gold);border:1px solid currentColor}
.badge-n{color:var(--pitch);border:1px solid currentColor}
.badge-i{color:var(--red);border:1px solid currentColor}

/* ── sheet ──────────────────────────────── */
.sheet[hidden]{display:none}
.sheet{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center}
.sheet .bg{position:absolute;inset:0;background:rgba(22,13,16,.4);backdrop-filter:blur(3px)}
.sheet .box{
  position:relative;width:100%;max-width:520px;max-height:86vh;overflow-y:auto;
  background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0;
  padding:20px var(--pad) calc(26px + env(safe-area-inset-bottom));
  animation:up .22s ease-out;box-shadow:0 -8px 40px rgba(22,13,16,.18);
}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.sheet .x{position:absolute;top:12px;right:12px;background:none;border:0;color:var(--mist-lo);font-size:22px;cursor:pointer;line-height:1;padding:4px 8px}
.sheet h2{font-size:23px;font-weight:900;line-height:1.15;padding-right:36px}
.sheet .h2ja{font-size:12.5px;color:var(--mist-lo);margin-top:3px}
.sheet .shirt{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;background:linear-gradient(160deg,var(--red),var(--red-lo));color:#fff;font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:600;margin-bottom:11px}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin:16px 0;border-radius:2px;overflow:hidden}
.kv div{background:var(--panel);padding:9px 11px}
.kv dt{font-size:9px;letter-spacing:.16em;color:var(--mist-lo);text-transform:uppercase}
.kv dd{font-size:14px;font-weight:700;margin-top:2px}
.sheet p.bio{font-size:13px;color:var(--mist);line-height:1.85}

/* ── cards ──────────────────────────────── */
.card{border:1px solid var(--line);background:var(--panel);padding:15px;margin-bottom:10px;border-radius:2px}
.card h3{font-size:16px;font-weight:800;margin-bottom:3px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.card .by{font-size:10.5px;letter-spacing:.1em;color:var(--mist-lo);text-transform:uppercase;margin-bottom:9px}
.card p{font-size:13px;color:var(--mist);line-height:1.75}
.card.major{border-left:3px solid var(--red)}

.boss{border:1px solid var(--line);border-top:3px solid var(--red);background:linear-gradient(168deg,var(--red-tint),var(--panel) 58%);padding:20px 18px;border-radius:2px}
.boss .nm{font-size:26px;font-weight:900;line-height:1.1}
.boss .nmja{font-size:13px;color:var(--mist);margin-top:3px}
.boss p{font-size:13px;color:var(--mist);line-height:1.9}
.princ{border:1px solid var(--line);background:var(--panel);padding:14px 15px;margin-bottom:8px;border-radius:2px}
.princ h4{font-size:14px;font-weight:800;margin-bottom:5px;display:flex;gap:9px;align-items:baseline}
.princ h4 i{font-style:normal;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--red)}
.princ p{font-size:12.5px;color:var(--mist);line-height:1.8}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:2px;overflow:hidden}
.compare>div{background:var(--panel);padding:14px 13px}
.compare .tg{font-size:9px;letter-spacing:.16em;color:var(--mist-lo);text-transform:uppercase}
.compare .nm{font-size:15px;font-weight:800;margin:3px 0 9px}
.compare>div:last-child .nm{color:var(--red)}
.compare li{list-style:none;font-size:12px;color:var(--mist);line-height:1.6;padding-left:12px;position:relative;margin:6px 0}
.compare li::before{content:"";position:absolute;left:0;top:.62em;width:5px;height:5px;background:var(--mist-lo);border-radius:50%}
.compare>div:last-child li::before{background:var(--red)}
.stafflist{border-top:1px solid var(--line)}
.stafflist div{display:flex;align-items:center;gap:11px;padding:11px 4px;border-bottom:1px solid var(--line);font-size:13.5px}
.stafflist .r{font-size:10.5px;color:var(--mist-lo);letter-spacing:.08em;margin-left:auto}

/* ── fixtures ───────────────────────────── */
.fx{display:grid;grid-template-columns:54px 26px 1fr auto;gap:11px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line)}
.fx .d{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--red);font-weight:600;line-height:1.35}
.fx .d small{display:block;color:var(--mist-lo);font-size:10px}
.fx .o{font-size:14.5px;font-weight:700;min-width:0}
.fx .o small{display:block;font-size:11px;color:var(--mist-lo);font-weight:400}
.fx .t{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--mist);text-align:right}
.fx .t .ha{display:block;font-size:9.5px;letter-spacing:.1em;color:var(--mist-lo)}
.fx .t.done{font-weight:600;color:var(--ink)}
.fx.win .t.done{color:var(--pitch)}
.fx.lose .t.done{color:var(--red)}

.clubgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:4px}
.cg{display:flex;flex-direction:column;align-items:center;gap:6px;padding:11px 4px;border:1px solid var(--line-lo);background:var(--panel);border-radius:2px}
.cg span{font-size:9.5px;color:var(--mist-lo);text-align:center;line-height:1.25}
.cg.me{border-color:var(--red);background:var(--red-tint)}
.cg.me span{color:var(--ink);font-weight:700}

/* ── transfer ───────────────────────────── */
.trow{display:flex;align-items:center;gap:11px;margin-bottom:10px}
.trow .arrow{font-family:'IBM Plex Mono',monospace;color:var(--mist-lo);font-size:13px}
.fee{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--gold);margin-left:auto;text-align:right;font-weight:600}
.pipe{display:flex;margin:13px 0 10px;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.pipe div{flex:1;text-align:center;padding:8px 2px;font-size:9.5px;color:var(--mist-lo);border-right:1px solid var(--line);font-weight:700}
.pipe div:last-child{border-right:0}
.pipe div.hit{background:var(--red);color:#fff;border-right-color:rgba(255,255,255,.25)}
.src{border:1px solid var(--line);background:var(--panel);padding:14px 15px;margin-bottom:10px;border-radius:2px}
.src .top{display:flex;align-items:center;gap:9px;margin-bottom:8px;flex-wrap:wrap}
.handle{font-size:13.5px;font-weight:800}
.handle span{color:var(--mist-lo);font-weight:400;font-size:12px}
.tier{font-size:9px;letter-spacing:.12em;font-weight:800;padding:3px 7px;border:1px solid currentColor;border-radius:2px}
.t1{color:var(--pitch)}.t2{color:var(--gold)}.t3{color:var(--mist-lo)}
.src p{font-size:12.5px;color:var(--mist);line-height:1.7}
.pending{display:inline-flex;align-items:center;gap:6px;margin-top:9px;font-size:11px;color:var(--mist-lo);font-family:'IBM Plex Mono',monospace}
.pending::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--mist-lo)}
.pending.on{color:var(--pitch)}
.pending.on::before{background:var(--pitch);animation:pulse 2.2s infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.scorer{display:grid;grid-template-columns:26px 1fr auto;gap:12px;align-items:center;padding:11px 4px;border:0;border-bottom:1px solid var(--line);width:100%;background:none;color:inherit;font:inherit;cursor:pointer;text-align:left}
.scorer .rk{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--mist-lo)}
.scorer .nm{font-size:14.5px;font-weight:700}
.scorer .nm small{display:block;font-size:10.5px;color:var(--mist-lo);font-weight:400}
.scorer .g{font-family:'IBM Plex Mono',monospace;font-size:20px;color:var(--red);font-weight:600}

.feed{padding:13px 0;border-bottom:1px solid var(--line)}
.feed .fh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.feed .fn{font-size:13.5px;font-weight:700}
.feed .fs{font-size:9.5px;letter-spacing:.12em;font-weight:800;padding:3px 7px;border:1px solid currentColor;white-space:nowrap;border-radius:2px}
.auto{color:var(--pitch)}.semi{color:var(--gold)}
.feed p{font-size:12px;color:var(--mist);margin-top:6px;line-height:1.7}
.feed code{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--mist-lo);word-break:break-all;display:block;margin-top:6px;background:var(--panel-2);padding:5px 7px;border-radius:2px}
.howto{counter-reset:s}
.howto li{list-style:none;position:relative;padding:11px 0 11px 34px;border-bottom:1px solid var(--line);font-size:13px;color:var(--mist);line-height:1.75}
.howto li::before{counter-increment:s;content:counter(s,decimal-leading-zero);position:absolute;left:0;top:12px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--red);font-weight:600}
.howto b{color:var(--ink);font-weight:700}
.howto code{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--red);background:var(--red-tint);padding:1px 5px;border-radius:2px}

.watch{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:13px;background:var(--red);color:#fff;border:0;font-family:inherit;font-size:13px;font-weight:800;letter-spacing:.09em;cursor:pointer;text-decoration:none}
.watch:hover{background:#E01234}
.notes{padding:12px 16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--mist);line-height:1.8}
.notes .info{color:var(--mist-lo);font-family:'IBM Plex Mono',monospace;font-size:11px;margin-bottom:6px}
.notes b{color:var(--ink);font-weight:700}
.notes li{list-style:none;padding-left:13px;position:relative;margin:5px 0}
.notes li::before{content:"";position:absolute;left:0;top:.75em;width:5px;height:1px;background:var(--mist-lo)}

footer{border-top:1px solid var(--line);margin-top:34px;padding-top:16px;font-size:11px;color:var(--mist-lo);line-height:1.85}
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="crest" style="--sz:26px;--cc:#C8102E"><i>LIV</i><img src="https://resources.premierleague.com/premierleague/badges/100/t14@x2.png" alt="" onerror="this.remove()"></span>
    <h1>KOP<em>·</em>DESK</h1>
    <button class="pill" id="srcPill" title="タップで再取得">読み込み中</button>
  </div>
  <nav role="tablist">
    <button role="tab" aria-selected="true"  data-t="match">試合</button>
    <button role="tab" aria-selected="false" data-t="squad">スカッド</button>
    <button role="tab" aria-selected="false" data-t="boss">監督・戦術</button>
    <button role="tab" aria-selected="false" data-t="transfer">移籍</button>
    <button role="tab" aria-selected="false" data-t="data">データ</button>
  </nav>
</header>

<main>
  <section class="panel-view" id="match"></section>
  <section class="panel-view" id="squad" hidden></section>
  <section class="panel-view" id="boss" hidden></section>
  <section class="panel-view" id="transfer" hidden></section>
  <section class="panel-view" id="data" hidden></section>
</main>

<div class="sheet" id="sheet" hidden>
  <div class="bg" data-close></div>
  <div class="box" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <button class="x" data-close aria-label="閉じる">×</button>
    <div id="sheetBody"></div>
  </div>
</div>

<script>
(function(){
"use strict";
let D;
const CREST = "https://resources.premierleague.com/premierleague/badges/";
const FM = "https://www.fotmob.com/api/data/";
const LFC = 8650;
const $ = s => document.querySelector(s);

/* ═══ ヘルパー ═══════════════════════════════════════════ */
const esc = s => String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

function club(key){
  return (D.clubs && D.clubs[key]) ||
    { ja:key||"?", en:key||"?", short:String(key||"?").slice(0,3).toUpperCase(), code:null, color:"#8A757C" };
}
/* エンブレム：プレミア公式CDNの200px PNG。読めなければ頭文字マークが下から出る */
function crest(key, size){
  const c = club(key), sz = size || 28;
  const img = c.code
    ? '<img src="' + CREST + "100/" + c.code + '@x2.png" alt="" loading="lazy" onerror="this.remove()">'
    : "";
  return '<span class="crest" style="--sz:' + sz + 'px;--cc:' + c.color + '"><i>' + esc(c.short) + '</i>' + img + '</span>';
}
const player   = id => D.squad.find(p => p.id === id) || null;
const byFmId   = id => D.squad.find(p => p.fmId === id) || null;
const byName   = n  => D.squad.find(p => p.name === n) || null;
const statJa   = t  => (D.statJa && D.statJa[t]) || t;

function shortName(p){
  if(!p) return "";
  if(p.dn) return p.dn;
  return String(p.name||"").split(" ").slice(-1)[0];
}
function age(dob){
  if(!dob) return null;
  const b = new Date(dob + "T00:00:00Z"), n = new Date();
  let a = n.getUTCFullYear() - b.getUTCFullYear();
  const m = n.getUTCMonth() - b.getUTCMonth();
  if(m < 0 || (m === 0 && n.getUTCDate() < b.getUTCDate())) a--;
  return a;
}
function jstParts(iso){
  const d = new Date(iso);
  const f = new Intl.DateTimeFormat("ja-JP",{timeZone:"Asia/Tokyo",month:"numeric",day:"numeric",weekday:"short",hour:"2-digit",minute:"2-digit"});
  const p = {};
  f.formatToParts(d).forEach(x => p[x.type] = x.value);
  return { md:p.month + "/" + p.day, wd:p.weekday, hm:p.hour + ":" + p.minute,
           full:p.month + "/" + p.day + "(" + p.weekday + ") " + p.hour + ":" + p.minute };
}
function fmtDate(d){ const p = String(d).split("-"); return Number(p[1]) + "月" + Number(p[2]) + "日"; }
/* プレシーズンは中立地開催が多い。FotMobはリヴァプールを常にホーム扱いにするので、
   会場がアンフィールド以外なら HOME/AWAY ではなく会場名を出す */
function homeLabel(f){
  const v = f.venue || "";
  if(v && !/Anfield/i.test(v)) return "中立地 · " + v;
  return f.home ? "HOME · Anfield" : "AWAY";
}
function money(v){
  if(!v) return null;
  if(v >= 1e6) return "€" + (v/1e6).toFixed(1).replace(/\.0$/,"") + "M";
  return "€" + Math.round(v/1e3) + "K";
}
/* FotMobの採点を色分け */
function rateColor(r){
  if(r == null) return "#8F7F86";
  if(r >= 8)   return "#136F3C";
  if(r >= 7)   return "#4B8F2B";
  if(r >= 6.5) return "#8A6A00";
  return "#B4551F";
}
const ratePill = r => r == null ? "" :
  '<span class="rt-pill" style="background:' + rateColor(r) + '">' + Number(r).toFixed(1) + '</span>';

/* ═══ 試合タブ ═══════════════════════════════════════════ */
function viewMatch(){
  const n = D.next, oc = club(n.opponent);
  let h = '';

  h += '<div class="next">' +
    '<div class="tag">NEXT MATCH · ' + esc(n.comp) + '</div>' +
    '<div class="vs">' + crest("liverpool",40) + '<span class="x">vs</span>' + crest(n.opponent,40) +
      '<span class="nm">' + esc(oc.en) + '<small>' + esc(oc.ja) + ' · ' + esc(homeLabel(n)) + '</small></span>' +
    '</div>' +
    '<div class="clock" id="clock">' +
      '<div class="unit"><b id="cd">--</b><span>DAYS</span></div><div class="colon">:</div>' +
      '<div class="unit"><b id="ch">--</b><span>HRS</span></div><div class="colon">:</div>' +
      '<div class="unit"><b id="cm">--</b><span>MIN</span></div><div class="colon">:</div>' +
      '<div class="unit"><b id="cs">--</b><span>SEC</span></div>' +
    '</div>' +
    '<div class="meta"><span><b>' + esc(jstParts(n.kickoffUTC).full) + '</b> JST</span>' +
      (n.venue ? '<span>' + esc(n.venue) + '</span>' : '') + '</div>' +
    (n.note ? '<div class="note">' + esc(n.note) + '</div>' : '') +
  '</div>';

  h += '<div class="eyebrow">直近の結果</div>';
  (D.results || []).forEach(r => { h += resultCard(r); });

  h += '<div class="eyebrow">プレシーズン日程 <b>' + (D.preseason||[]).length + '試合</b></div>';
  (D.preseason || []).forEach(f => { h += fixtureRow(f, f.venue || ""); });

  h += '<div class="eyebrow">プレミアリーグ 2026/27 <b>開幕から</b></div>';
  (D.league || []).forEach(f => {
    h += fixtureRow(f, (f.note ? f.note + " · " : "") + (f.home ? "Anfield" : "Away"));
  });

  const pl = ["arsenal","aston-villa","bournemouth","brentford","brighton","chelsea","coventry","crystal-palace",
    "everton","fulham","hull","ipswich","leeds","liverpool","man-city","man-utd","newcastle","forest","sunderland","tottenham"];
  h += '<div class="eyebrow">プレミアリーグ 全20クラブ</div><div class="clubgrid">';
  pl.forEach(k => { h += '<div class="cg' + (k === "liverpool" ? " me" : "") + '">' + crest(k,32) + '<span>' + esc(club(k).ja) + '</span></div>'; });
  h += '</div>';

  $("#match").innerHTML = h;
  startClock();
}

function fixtureRow(f, sub){
  const c = club(f.opp), t = jstParts(f.kickoffUTC);
  const done = !!(f.finished && f.score);
  let cls = "";
  if(done){
    const s = String(f.score).split("-").map(x => parseInt(x,10));
    const us = f.home ? s[0] : s[1], them = f.home ? s[1] : s[0];
    cls = us > them ? " win" : us < them ? " lose" : "";
  }
  return '<div class="fx' + cls + '">' +
    '<span class="d">' + esc(t.md) + '<small>' + esc(t.wd) + '</small></span>' +
    crest(f.opp,26) +
    '<span class="o">' + esc(c.en) + '<small>' + esc(sub) + '</small></span>' +
    '<span class="t' + (done ? " done" : "") + '">' + esc(done ? f.score : t.hm) +
      '<span class="ha">' + (done ? (cls === " win" ? "WIN" : cls === " lose" ? "LOSS" : "DRAW")
        : (f.venue && !/Anfield/i.test(f.venue) ? "中立" : (f.home ? "H" : "A"))) + '</span></span>' +
  '</div>';
}

function resultCard(r){
  const hc = club(r.home), ac = club(r.away);
  const homeWin = r.homeScore > r.awayScore, awayWin = r.awayScore > r.homeScore;
  let h = '<article class="result">' +
    '<div class="head"><span>' + esc(fmtDate(r.date)) + ' · ' + esc(r.venue) + '</span><span class="ft">FT</span></div>' +
    '<div class="scoreline">' +
      '<div class="row' + (r.home === "liverpool" ? " us" : "") + (awayWin ? " lose" : "") + '">' + crest(r.home,30) +
        '<span class="club">' + esc(hc.en) + '</span><span class="num">' + r.homeScore + '</span></div>' +
      '<div class="row' + (r.away === "liverpool" ? " us" : "") + (homeWin ? " lose" : "") + '">' + crest(r.away,30) +
        '<span class="club">' + esc(ac.en) + '</span><span class="num">' + r.awayScore + '</span></div>' +
    '</div>';

  if(r.events && r.events.length){
    h += '<div class="timeline">';
    r.events.forEach(e => {
      h += '<div class="ev ' + e.side + '"><span class="min">' + e.min + "'" + '</span>' +
           '<span class="who">' + esc(e.who) + '<span class="agg">' + esc(e.agg) + '</span></span></div>';
    });
    h += '</div>';
  }

  if(r.starters && r.starters.length){
    h += '<details class="blk"><summary>スタメンと採点 · ' + esc(r.formation || "") +
      (r.potm ? ' · MOM ' + esc(r.potm) : '') + '</summary><div class="blkbody">' +
      pitchHTML(r.starters.map(s => ({ id:(byFmId(s.fmId)||{}).id, name:s.name, no:s.no, x:s.x, y:s.y,
                                       rating:s.rating, off:s.out, gk:s.y < 15 }))) +
      benchHTML(r.subs || []) + '</div></details>';
  }

  if(r.statGroups && r.statGroups.length){
    h += '<details class="blk"><summary>試合スタッツ</summary><div class="blkbody">';
    r.statGroups.forEach(g => {
      h += '<div class="sgrp"><h4>' + esc(g.ja || statJa(g.title)) + '</h4>';
      (g.rows || []).forEach(row => { h += statBar(row.t, row.v); });
      h += '</div>';
    });
    h += '</div></details>';
  }

  const info = [];
  if(r.ht) info.push("HT " + r.ht);
  if(r.attendance) info.push("観客 " + r.attendance + "人");
  h += '<div class="notes">' + (info.length ? '<div class="info">' + esc(info.join("  ／  ")) + '</div>' : '') +
       '<ul>' + (r.notes||[]).map(t => '<li>' + t + '</li>').join("") + '</ul></div>';

  if(r.video) h += '<a class="watch" href="' + esc(r.video) + '" target="_blank" rel="noopener">▶ 公式ハイライトを見る</a>';
  return h + '</article>';
}

/* 「467 (90%)」のような文字列からも棒グラフ用の数値を取り出す */
function statNum(v){
  if(typeof v === "number") return v;
  const m = String(v).match(/[\d.]+/);
  return m ? parseFloat(m[0]) : 0;
}
/* 少ないほうが良いスタッツ。ここは数字が小さいほうを強調する */
const LOWER_BETTER = ["Yellow cards","Red cards","Fouls committed","Big chances missed",
                      "Offsides","Shots off target","Blocked shots"];
function statBar(title, v){
  if(!v || v.length < 2) return "";
  const a = statNum(v[0]), b = statNum(v[1]), t = (a + b) || 1;
  const pct = title === "Ball possession";
  const txt = x => pct ? x + "%" : String(x);
  const flip = LOWER_BETTER.indexOf(title) >= 0;
  const good = a === b ? 0 : (flip ? (a < b ? 1 : 2) : (a > b ? 1 : 2));
  return '<div class="stat"><div class="lb">' +
    '<b class="' + (good === 1 ? "win" : "") + '">' + esc(txt(v[0])) + '</b>' +
    '<span>' + esc(statJa(title)) + '</span>' +
    '<b class="' + (good === 2 ? "win" : "") + '">' + esc(txt(v[1])) + '</b></div>' +
    '<div class="bar"><i class="a" style="width:' + (a/t*100).toFixed(1) + '%"></i>' +
    '<i class="b" style="width:' + (b/t*100).toFixed(1) + '%"></i></div></div>';
}

/* ═══ ピッチ図（予想スタメンと実スタメンで共用） ══════════ */
function pitchHTML(list){
  let h = '<div class="pitch"><svg class="lines" viewBox="0 0 72 100" preserveAspectRatio="none" aria-hidden="true">' +
    '<g fill="none" stroke="var(--pitch-line)" stroke-width=".4">' +
    '<rect x="1" y="1" width="70" height="98"/><line x1="1" y1="50" x2="71" y2="50"/>' +
    '<circle cx="36" cy="50" r="9"/>' +
    '<rect x="18" y="1" width="36" height="13"/><rect x="27" y="1" width="18" height="5.5"/>' +
    '<rect x="18" y="86" width="36" height="13"/><rect x="27" y="93.5" width="18" height="5.5"/>' +
    '</g></svg>';
  list.forEach(s => {
    const p = s.id ? player(s.id) : byName(s.name);
    const nm = p ? shortName(p) : String(s.name||"").split(" ").slice(-1)[0];
    const no = s.no != null ? s.no : (p && p.no != null ? p.no : "–");
    const isGk = s.gk || s.role === "GK";
    h += '<div class="pl' + (isGk ? " gk" : "") + '" style="left:' + s.x + '%;bottom:' + s.y + '%">' +
      '<button' + (p ? ' data-p="' + esc(p.id) + '"' : ' disabled') + '>' +
      '<span class="sh">' + esc(no) +
        (s.rating != null ? '<span class="rt" style="background:' + rateColor(s.rating) + '">' + Number(s.rating).toFixed(1) + '</span>' : '') +
        (s.off != null ? '<span class="off">↓' + s.off + "'" + '</span>' : '') +
      '</span>' +
      '<span class="nm">' + esc(nm) + '</span>' +
      '<span class="rl">' + esc(s.role || "") + '</span></button></div>';
  });
  return h + '</div>';
}
function benchHTML(subs){
  if(!subs.length) return "";
  let h = '<div class="bench">';
  subs.forEach(s => {
    const p = byFmId(s.fmId) || byName(s.name);
    const nm = p ? shortName(p) : String(s.name||"").split(" ").slice(-1)[0];
    h += '<button' + (p ? ' data-p="' + esc(p.id) + '"' : ' disabled') + '><b>' + esc(s.no != null ? s.no : "–") + '</b>' +
      esc(nm) + (s.inn != null ? ' <span style="color:var(--mist-lo);font-size:10px">↑' + s.inn + "'" + '</span>' : '') +
      (s.rating != null ? ' ' + ratePill(s.rating) : '') + '</button>';
  });
  return h + '</div>';
}

/* ═══ スカッドタブ ═══════════════════════════════════════ */
function viewSquad(){
  const f = D.formation;
  let h = '<div class="eyebrow">フォーメーション</div><div class="pitchwrap">' +
    '<div class="pitchhead"><b>' + esc(f.name) + '</b><span>' + esc(f.label) + '</span></div>' +
    pitchHTML(f.xi) +
    '<div class="formnote">' + esc(f.note) + '</div>' +
    '<div class="eyebrow" style="margin:16px 0 8px">控え・その他</div><div class="bench">';
  (f.bench||[]).forEach(id => {
    const p = player(id);
    if(!p) return;
    h += '<button data-p="' + esc(p.id) + '"><b>' + (p.no != null ? p.no : "–") + '</b>' + esc(shortName(p)) + '</button>';
  });
  h += '</div></div>';

  const groups = [["GK","ゴールキーパー"],["DF","ディフェンダー"],["MF","ミッドフィルダー"],["FW","フォワード"],["ACAD","アカデミー・その他"]];
  groups.forEach(g => {
    const list = D.squad.filter(p => p.pos === g[0]);
    if(!list.length) return;
    list.sort((a,b) => (a.no == null) - (b.no == null) || (a.no - b.no));
    h += '<div class="eyebrow">' + esc(g[1]) + ' <b>' + list.length + '</b></div><div class="plist">';
    list.forEach(p => {
      const a = age(p.dob);
      let badges = "";
      if(p.captain) badges += '<span class="badge-c">C</span>';
      if(p.injury)  badges += '<span class="badge-i">負傷</span>';
      h += '<button class="prow" data-p="' + esc(p.id) + '">' +
        '<span class="no">' + (p.no != null ? p.no : "–") + '</span>' +
        '<span class="nm">' + esc(p.name) + badges + '<span class="ja">' + esc(p.ja) + ' · ' + esc(p.detail) + '</span></span>' +
        '<span class="rt"><span class="fl">' + p.nat + '</span><br>' + (a != null ? a + "歳" : "—") + '</span>' +
      '</button>';
    });
    h += '</div>';
  });

  /* 得点ランキングは試合結果のゴールから自動集計する */
  const tally = {};
  (D.results || []).forEach(r => (r.events || []).forEach(e => {
    if(e.side !== "home" || r.home !== "liverpool") return;
    tally[e.who] = (tally[e.who] || 0) + 1;
  }));
  const scorers = Object.keys(tally).map(n => ({ name:n, g:tally[n] })).sort((a,b) => b.g - a.g);
  if(scorers.length){
    h += '<div class="eyebrow">プレシーズン得点ランキング</div>';
    scorers.forEach((s,i) => {
      const p = byName(s.name);
      h += '<button class="scorer"' + (p ? ' data-p="' + esc(p.id) + '"' : ' disabled') + '>' +
        '<span class="rk">' + String(i+1).padStart(2,"0") + '</span>' +
        '<span class="nm">' + esc(s.name) + '<small>' + esc(p ? p.detail : "") +
        (p && age(p.dob) != null ? " · " + age(p.dob) + "歳" : "") + '</small></span>' +
        '<span class="g">' + s.g + '</span></button>';
    });
  }

  const hurt = D.squad.filter(p => p.injury);
  h += '<div class="eyebrow">負傷者 <b>' + hurt.length + '名</b></div>';
  if(hurt.length){
    hurt.forEach(p => {
      h += '<div class="card"><h3>' + esc(p.name) + '<span class="badge-i">OUT</span></h3>' +
        '<div class="by">復帰見込み · ' + esc(p.injury) + '</div>' +
        '<p>' + esc(p.ja) + '（' + esc(p.detail) + '）。' + esc(p.note || "") + '</p></div>';
    });
  } else {
    h += '<div class="card"><p>離脱者なし。</p></div>';
  }

  $("#squad").innerHTML = h;
}

/* ═══ 監督タブ ═══════════════════════════════════════════ */
function viewBoss(){
  const m = D.manager;
  let h = '<div class="boss">' +

let timer = null;
function startClock(){
  const KICK = new Date(D.next.kickoffUTC);
  const pad = n => String(Math.max(0,n)).padStart(2,"0");
  if(timer) clearInterval(timer);
  function tick(){
    const box = document.getElementById("clock");
    if(!box) return;
    const diff = KICK - new Date();
    if(diff <= 0){
      box.innerHTML = '<div class="unit" style="text-align:left"><b style="font-size:26px;color:var(--red)">KICK OFF</b></div>';
      clearInterval(timer); return;
    }
    const s = Math.floor(diff/1000);
    document.getElementById("cd").textContent = pad(Math.floor(s/86400));
    document.getElementById("ch").textContent = pad(Math.floor(s/3600)%24);
    document.getElementById("cm").textContent = pad(Math.floor(s/60)%60);
    document.getElementById("cs").textContent = pad(s%60);
  }
  tick();
  timer = setInterval(tick, 1000);
}

/* ═══ FotMob 自動更新 ════════════════════════════════════
   公式に公開されたAPIではないので、失敗しても必ず data.js の
   保存データで表示が成立するようにしてある。
   ══════════════════════════════════════════════════════ */
function getJSON(url, ms){
  const ac = new AbortController();
  const to = setTimeout(() => ac.abort(), ms || 9000);
  return fetch(url, { signal:ac.signal, cache:"no-store" })
    .then(r => { if(!r.ok) throw new Error(r.status); return r.json(); })
    .finally(() => clearTimeout(to));
}
/* FotMobのクラブ名 → clubs のキー。
   一覧では "Man United"、試合詳細では "Manchester United" と表記が揺れるので、
   対応表 → 正式名の一致 → 部分一致 の順に探す。 */
const norm = s => String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"");
function fmClub(name){
  if(!name) return null;
  if(D.fmNames && D.fmNames[name]) return D.fmNames[name];
  const n = norm(name);
  const keys = Object.keys(D.clubs || {});
  let hit = keys.find(k => norm(D.clubs[k].en) === n);
  if(hit) return hit;
  hit = keys.find(k => { const e = norm(D.clubs[k].en); return e.length > 3 && (e.indexOf(n) === 0 || n.indexOf(e) === 0); });
  return hit || null;
}

function applyTeam(j){
  /* 日程とスコア */
  const all = ((j.fixtures || {}).allFixtures || {}).fixtures || [];
  const pre = [], lg = [];
  all.forEach(f => {
    const st = f.status || {};
    const t = st.utcTime;
    if(!t || t < "2026-07-01") return;
    const key = fmClub((f.opponent || {}).name);
    if(!key) return;
    const row = { kickoffUTC:t.replace(".000Z","Z"), opp:key,
                  home:(f.home || {}).id === LFC, score:st.scoreStr || null,
                  finished:!!st.finished, fmMatchId:f.id };
    ((f.tournament || {}).name === "Club Friendlies" ? pre : lg).push(row);
  });
  if(pre.length){
    /* 会場メモは保存データから引き継ぐ */
    const memo = {};
    (D.preseason || []).forEach(x => { if(x.venue) memo[x.fmMatchId] = x.venue; });
    pre.forEach(x => x.venue = memo[x.fmMatchId] || "");
    D.preseason = pre;
  }
  if(lg.length){
    const memo = {};
    (D.league || []).forEach(x => { if(x.note) memo[x.fmMatchId] = x.note; });
    lg.forEach(x => x.note = memo[x.fmMatchId] || "");
    D.league = lg.slice(0, 12);
  }

  /* 次の試合 */
  const upcoming = pre.concat(lg).filter(x => !x.finished)
    .sort((a,b) => a.kickoffUTC < b.kickoffUTC ? -1 : 1)[0];
  if(upcoming){
    D.next = { opponent:upcoming.opp, home:upcoming.home,
               comp:pre.indexOf(upcoming) >= 0 ? "プレシーズン親善試合" : "プレミアリーグ",
               kickoffUTC:upcoming.kickoffUTC,
               venue:upcoming.venue || (upcoming.home ? "Anfield" : ""),
               note:D.next && D.next.kickoffUTC === upcoming.kickoffUTC ? D.next.note : "" };
  }

  /* スカッドの負傷・年齢・市場価値 */
  const fmPlayers = {};
  ((j.squad || {}).squad || []).forEach(g => {
    if(g.title === "coach") return;
    (g.members || []).forEach(m => fmPlayers[m.id] = m);
  });
  D.squad.forEach(p => {
    const m = fmPlayers[p.fmId];
    if(!m) return;
    p.injury = m.injury ? m.injury.expectedReturn : null;
    if(m.dateOfBirth) p.dob = m.dateOfBirth;
    if(m.height) p.height = m.height;
    if(m.transferValue) p.value = m.transferValue;
    if(m.shirtNumber != null) p.no = m.shirtNumber;
  });

  return { newest: pre.concat(lg).filter(x => x.finished)
    .sort((a,b) => a.kickoffUTC < b.kickoffUTC ? 1 : -1)[0] };
}

function buildResult(md, prev){
  const c = md.content || {}, g = md.general || {};
  const mf = c.matchFacts || {}, box = mf.infoBox || {};
  const teams = ((md.header || {}).teams) || [];
  const homeKey = fmClub((g.homeTeam || {}).name), awayKey = fmClub((g.awayTeam || {}).name);
  if(!homeKey || !awayKey) return null;

  const events = [];
  ((mf.events || {}).events || []).forEach(e => {
    if(e.type !== "Goal" || !e.newScore) return;
    events.push({ min:e.time, side:e.isHome ? "home" : "away",
                  who:(e.player || {}).name || "", agg:e.newScore[0] + " - " + e.newScore[1] });
  });

  const groups = [];
  const per = ((c.stats || {}).Periods || {}).All;
  if(per && per.stats){
    per.stats.forEach(grp => {
      const rows = (grp.stats || []).filter(s => s.type !== "title")
        .map(s => ({ t:s.title, v:s.stats }));
      if(rows.length) groups.push({ title:grp.title, ja:statJa(grp.title), rows:rows });
    });
  }

  const ln = (c.lineup || {});
  const us = ((g.homeTeam || {}).id === LFC) ? ln.homeTeam : ln.awayTeam;
  const conv = (list, starter) => (list || []).map(p => {
    const perf = p.performance || {}, sub = perf.substitutionEvents || [], vl = p.verticalLayout || {};
    const find = t => { const x = sub.find(s => s.type === t); return x ? x.time : null; };
    return { fmId:p.id, name:p.name, no:p.shirtNumber,
             x:starter ? Math.round((1 - (vl.x != null ? vl.x : .5)) * 1000)/10 : null,
             y:starter ? Math.round((vl.y != null ? vl.y : .5) * 1000)/10 : null,
             rating:perf.rating != null ? perf.rating : null,
             out:find("subOut"), inn:find("subIn") };
  });

  const stadium = box.Stadium || {};
  return {
    fmMatchId:String(g.matchId),
    date:(g.matchTimeUTC ? new Date(g.matchTimeUTCDate || g.matchTimeUTC) : new Date()).toISOString().slice(0,10),
    comp:g.leagueName === "Club Friendlies" ? "プレシーズン親善試合" : (g.leagueName || ""),
    venue:[stadium.name, stadium.city].filter(Boolean).join(", "),
    home:homeKey, homeScore:(teams[0] || {}).score,
    away:awayKey, awayScore:(teams[1] || {}).score,
    ht:null,
    attendance:box.Attendance ? Number(box.Attendance).toLocaleString("en-US") : null,
    formation:us ? us.formation : null,
    potm:((mf.playerOfTheMatch || {}).name || {}).fullName || null,
    events:events, statGroups:groups,
    starters:us ? conv(us.starters, true) : [],
    subs:us ? conv(us.subs, false) : [],
    notes:(prev && prev.fmMatchId === String(g.matchId)) ? prev.notes : [],
    video:(prev && prev.fmMatchId === String(g.matchId)) ? prev.video : null
  };
}

function setPill(state, text){
  const el = $("#srcPill");
  el.className = "pill" + (state === "live" ? " live" : "") + (state === "busy" ? " busy" : "");
  el.textContent = text;
}
async function refresh(){
  if(!D.fotmob || !D.fotmob.enabled){ setPill("local","保存データ"); return; }
  setPill("busy","取得中…");
  try{
    const team = await getJSON(FM + "teams?id=" + D.fotmob.teamId);
    const { newest } = applyTeam(team);

    if(newest){
      const prev = (D.results || [])[0];
      const md = await getJSON(FM + "matchDetails?matchId=" + newest.fmMatchId);
      const built = buildResult(md, prev);
      if(built){
        /* 保存データと同じ試合なら、書いてあるコメントと映像リンクは残す */
        if(prev && prev.fmMatchId === built.fmMatchId){
          built.ht = prev.ht; built.notes = prev.notes; built.video = prev.video;
        }
        D.results = [built].concat((D.results || []).filter(r => r.fmMatchId !== built.fmMatchId)).slice(0,3);
      }
    }
    render();
    const t = new Date();
    setPill("live","FotMob " + String(t.getHours()).padStart(2,"0") + ":" + String(t.getMinutes()).padStart(2,"0"));
  }catch(err){
    setPill("local","保存データ");
  }
}

window.KOP_BOOT = function(){
  D = window.KOP_DATA;
  if(!D){
    document.querySelector("main").innerHTML =
      '<p style="color:var(--mist);padding:24px 0;line-height:1.9">' +
      'データ（data.js）を読み込めませんでした。<br>' +
      'GitHubで data.js を編集したときに、記号（ , " { } ）を消してしまった可能性があります。' +
      'GitHubの History から1つ前に戻すと復旧します。</p>';
    setPill("local","エラー");
    return;
  }
  render();
  const start = (location.hash || "").replace("#","");
  if(start){
    const b = document.querySelector('nav button[data-t="' + start + '"]');
    if(b) b.click();
  }
  $("#srcPill").addEventListener("click", refresh);
  refresh();
};

/* data.js は毎回「新しいもの」を読みに行く。
   こうしないと、GitHubで更新してもiPhoneが古いデータを表示し続けることがある。 */
(function(){
  const s = document.createElement("script");
  s.src = "data.js?v=" + Date.now();
  s.onload = () => window.KOP_BOOT();
  s.onerror = () => window.KOP_BOOT();
  document.body.appendChild(s);
})();
